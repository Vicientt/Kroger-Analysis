version: 2

models:
  - name: stg_kroger_products
    description: flattened product data from raw csv (one row per product)
    columns:
      - name: state
      - name: store_id
      - name: store_name
      - name: category
      - name: product_id
      - name: brand
      - name: description
      - name: regular_price
      - name: promo_price
      - name: size
      - name: load_date
