version: 2

models:
  - name: stg_kroger_products
    description: Staging model - flattened product data from raw JSON (one row per product per store per category)
    columns:
      - name: state
      - name: store_id
      - name: store_name
      - name: category
      - name: product_id
      - name: brand
      - name: description
      - name: regular_price
      - name: promo_price
      - name: size
